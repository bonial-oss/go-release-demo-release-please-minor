---
name: commitlint

on:
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  commitlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run commitlint against every commit on the PR branch
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.yaml
          failOnWarnings: true
          firstParent: false
          helpURL: "https://www.conventionalcommits.org/"
