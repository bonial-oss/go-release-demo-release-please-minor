version: 2

before:
  hooks:
    - go mod tidy -diff
    - go mod verify

builds:
  - id: demo
    binary: demo
    main: ./
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/bonial-oss/go-release-demo-release-please-minor/internal/buildinfo.Version={{.Version}}
      - -X github.com/bonial-oss/go-release-demo-release-please-minor/internal/buildinfo.Commit={{.FullCommit}}
      - -X github.com/bonial-oss/go-release-demo-release-please-minor/internal/buildinfo.Date={{.CommitDate}}
      - -X github.com/bonial-oss/go-release-demo-release-please-minor/internal/buildinfo.TreeState={{ if .IsGitDirty }}dirty{{ else }}clean{{ end }}
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: demo
    formats: [tar.gz]
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSES/*
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

sboms:
  - id: archive
    artifacts: archive
    documents:
      - "${artifact}.sbom.spdx.json"

signs:
  - id: checksum
    cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - "sign-blob"
      - "--yes"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
    artifacts: checksum

release:
  draft: true
  make_latest: true
  prerelease: auto
  mode: replace

changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.+\))?:'
      order: 1
    - title: Other
      order: 999
